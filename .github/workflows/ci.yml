name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a keyword added to the language upstream shows up here without
  # anybody remembering to look. The extension pins a released language version,
  # but a release it has not caught up with is exactly what goes unnoticed.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  grammars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci

      - name: The committed grammars must be what the generator produces
        # They are generated, so there is nothing to check by hand -- the check
        # is that nobody edited the output instead of the generator.
        run: |
          npm run gen
          git diff --exit-code syntaxes/ || {
            echo "::error::syntaxes/ is not what tools/gen-grammars.mjs produces. Run 'npm run gen' and commit."
            exit 1
          }

      - name: VS Code's own tokeniser must colour every reserved word
        # `npm test` also drives `activate()` against a stub of the editor API,
        # using the real compiler. Both are needed and neither replaces the
        # other: the grammar has to survive a half-typed file, and the compiler's
        # job on a half-typed file is to refuse it.
        run: npm test

      - name: The bundled compiler must be a published one
        # The `.vsix` carries a WebAssembly compiler, and it is the only file
        # here that cannot be regenerated locally -- building it needs emsdk. So
        # the check is that the committed bytes are the released bytes, byte for
        # byte. Anything else means somebody shipped a compiler nobody can point
        # at a tag for.
        run: |
          npm run wasm
          git diff --exit-code wasm/ || {
            echo "::error::wasm/ is not the latest released build. Run 'npm run wasm' and commit, or pin deliberately."
            exit 1
          }

      - name: The package must actually build
        # Catches the failure mode nothing above can see: a file the extension
        # needs at runtime being excluded from the archive. `.vscodeignore` is a
        # list of things NOT to ship, and getting it wrong produces an extension
        # that installs cleanly and does nothing.
        run: |
          npx --yes @vscode/vsce package -o /tmp/x.vsix
          for f in wasm/loophole.js wasm/loophole.wasm src/extension.js src/verdict.js; do
            unzip -l /tmp/x.vsix | grep -q "extension/$f" || {
              echo "::error::$f is missing from the .vsix"; exit 1; }
          done

      - name: Is the language ahead of us?
        # Advisory. The grammar tracks a released language version on purpose,
        # so being behind is not a failure -- but it should be visible.
        continue-on-error: true
        run: |
          node tools/fetch-keywords.mjs
          git diff --exit-code tools/keywords.json || {
            echo "::warning::the published compiler reserves different words. Run 'npm run keywords && npm run gen'."
          }

  # A real VS Code, because the manifest is the one thing no other check here can
  # exercise: `main`, `activationEvents`, and whether a `.wish` file is even
  # recognised as the `wish` language. Get any of those wrong and the package
  # installs without a word of complaint and then does nothing.
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      # `xvfb-run` because VS Code is an Electron app and wants a display even
      # when nobody is looking at it.
      - run: xvfb-run -a npm run test:editor
